services:
  mysql:
    image: mysql:8.4
    container_name: qywl-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
      MYSQL_DATABASE: critter_codex
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    container_name: qywl-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/critter_codex?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
      CRITTER_SECURITY_JWT_SECRET: ${CRITTER_JWT_SECRET:-qingyan-wanling-docker-demo-secret-key-at-least-32-bytes}
      CRITTER_SECURITY_AES_KEY: ${CRITTER_AES_KEY:-qyWL2026CritterAESKey0123456789==}
      CRITTER_SECURITY_CORS_ALLOWED_ORIGINS: "http://localhost:${FRONTEND_PORT:-8088},http://127.0.0.1:${FRONTEND_PORT:-8088}"
    ports:
      - "${BACKEND_PORT:-8083}:8080"
    volumes:
      - backend-files:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:8080/api/v1/projects?page=1&size=1' >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    container_name: qywl-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8088}:80"

  # 只在需要重置演示数据时运行：docker compose --profile demo run --rm demo-data
  demo-data:
    image: mysql:8.4
    profiles: ["demo"]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
    volumes:
      - ../critter-backend/demo/qywl-demo.sql:/demo/qywl-demo.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mysql -h mysql -uroot -p"$$MYSQL_ROOT_PASSWORD" critter_codex
        < /demo/qywl-demo.sql
        && echo "demo data imported"

volumes:
  mysql-data:
  backend-files:
